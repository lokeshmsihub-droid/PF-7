# Enterprise Platform Managed SAST Ruleset
# Version: 2.0.0 (enterprise-sast-v2)
# Category: Automated Compliance & Vulnerability Management
rules:
  # ==========================================
  # PYTHON SECURITY RULES
  # ==========================================
  - id: enterprise.security.sql-injection-format
    languages: [python]
    severity: ERROR
    message: "Detected potential SQL Injection via string formatting or concatenation in database query."
    metadata:
      cwe: "CWE-89: Improper Neutralization of Special Elements used in an SQL Command ('SQL Injection')"
      owasp: "A03:2021 - Injection"
      category: security
      confidence: HIGH
      remediation: "Use parameterized queries or ORM query builders instead of raw string interpolation."
    pattern-either:
      - pattern: $CURSOR.execute(f"...{$VAR}...")
      - pattern: $CURSOR.execute("..." % ($VAR))
      - pattern: $CURSOR.execute("..." + $VAR)
      - pattern: $DB.raw(f"...{$VAR}...")

  - id: enterprise.security.command-injection
    languages: [python]
    severity: ERROR
    message: "Detected execution of external shell commands with untrusted input."
    metadata:
      cwe: "CWE-78: Improper Neutralization of Special Elements used in an OS Command ('OS Command Injection')"
      owasp: "A03:2021 - Injection"
      category: security
      confidence: HIGH
      remediation: "Avoid using shell=True with dynamic arguments. Pass arguments as a list with shell=False."
    pattern-either:
      - pattern: subprocess.Popen($CMD, ..., shell=True, ...)
      - pattern: subprocess.run($CMD, ..., shell=True, ...)
      - pattern: subprocess.call($CMD, ..., shell=True, ...)
      - pattern: os.system($CMD)
      - pattern: os.popen($CMD)

  - id: enterprise.security.insecure-deserialization
    languages: [python]
    severity: ERROR
    message: "Unsafe deserialization using pickle or joblib can result in arbitrary code execution."
    metadata:
      cwe: "CWE-502: Deserialization of Untrusted Data"
      owasp: "A08:2021 - Software and Data Integrity Failures"
      category: security
      confidence: HIGH
      remediation: "Use safe serialization formats like JSON, safetensors, or Protocol Buffers instead of pickle."
    pattern-either:
      - pattern: pickle.loads(...)
      - pattern: pickle.load(...)
      - pattern: _pickle.loads(...)
      - pattern: _pickle.load(...)
      - pattern: joblib.load(...)
      - pattern: shelve.open(...)

  - id: enterprise.security.insecure-eval
    languages: [python]
    severity: ERROR
    message: "Use of eval() or exec() allows arbitrary code execution."
    metadata:
      cwe: "CWE-94: Improper Control of Generation of Code ('Code Injection')"
      owasp: "A03:2021 - Injection"
      category: security
      confidence: HIGH
      remediation: "Avoid dynamic code execution. Use ast.literal_eval for safe literal parsing."
    pattern-either:
      - pattern: eval(...)
      - pattern: exec(...)

  - id: enterprise.security.insecure-prng-seed
    languages: [python]
    severity: WARNING
    message: "Use of pseudo-random number generator (random.seed / random) is cryptographically insecure."
    metadata:
      cwe: "CWE-338: Use of Cryptographically Weak Pseudo-Random Number Generator (PRNG)"
      owasp: "A02:2021 - Cryptographic Failures"
      category: security
      confidence: MEDIUM
      remediation: "Use secrets module (secrets.token_hex, secrets.randbelow) for security-sensitive operations."
    pattern-either:
      - pattern: random.seed(...)
      - pattern: np.random.seed(...)

  - id: enterprise.security.hardcoded-filesystem-path
    languages: [python]
    severity: WARNING
    message: "Hardcoded absolute developer directory path leaks internal environment and breaks portability."
    metadata:
      cwe: "CWE-200: Exposure of Sensitive Information to an Unauthorized Actor"
      owasp: "A01:2021 - Broken Access Control"
      category: security
      confidence: HIGH
      remediation: "Use relative paths with pathlib.Path or configure directories through environment variables."
    pattern-regex: "['\"]/(Users|home|root|C:\\\\)[^'\"]+['\"]"

  - id: enterprise.security.hardcoded-secret-python
    languages: [python]
    severity: ERROR
    message: "Identified hardcoded credential, secret key, or authentication token."
    metadata:
      cwe: "CWE-798: Use of Hard-coded Credentials"
      owasp: "A07:2021 - Identification and Authentication Failures"
      category: security
      confidence: HIGH
      remediation: "Store credentials in environment variables or an enterprise secret manager."
    pattern-either:
      - patterns:
          - pattern: $KEY = "$VAL"
          - metavariable-regex:
              metavariable: $KEY
              regex: (?i).*(api_key|token|secret|password|passwd|auth_token).*
          - metavariable-regex:
              metavariable: $VAL
              regex: .{8,}
      - patterns:
          - pattern: $KEY = "$VAL"
          - metavariable-regex:
              metavariable: $VAL
              regex: (super-secret-token|AIzaSy|ghp_|AKIA|eyJhbG).*

  - id: enterprise.security.weak-cryptography-hash
    languages: [python]
    severity: WARNING
    message: "Use of insecure or obsolete hash algorithm (MD5 or SHA-1)."
    metadata:
      cwe: "CWE-328: Use of Weak Hash"
      owasp: "A02:2021 - Cryptographic Failures"
      category: security
      confidence: HIGH
      remediation: "Use secure hashing algorithms such as SHA-256, SHA-3, or argon2id."
    pattern-either:
      - pattern: hashlib.md5(...)
      - pattern: hashlib.sha1(...)

  - id: enterprise.security.unsafe-yaml-load
    languages: [python]
    severity: ERROR
    message: "Unsafe YAML loading allows arbitrary object instantiation and code execution."
    metadata:
      cwe: "CWE-502: Deserialization of Untrusted Data"
      owasp: "A08:2021 - Software and Data Integrity Failures"
      category: security
      confidence: HIGH
      remediation: "Use yaml.safe_load() or specify Loader=yaml.SafeLoader."
    pattern: yaml.load($DATA)

  - id: enterprise.security.disabled-ssl-verification
    languages: [python]
    severity: ERROR
    message: "SSL certificate validation is explicitly disabled (verify=False), enabling Man-In-The-Middle attacks."
    metadata:
      cwe: "CWE-295: Improper Certificate Validation"
      owasp: "A07:2021 - Identification and Authentication Failures"
      category: security
      confidence: HIGH
      remediation: "Remove verify=False or provide a valid CA bundle path."
    pattern: requests.$METHOD(..., verify=False, ...)

  - id: enterprise.security.debug-mode-enabled
    languages: [python]
    severity: WARNING
    message: "Application debug mode is enabled, exposing interactive debuggers and stack traces."
    metadata:
      cwe: "CWE-489: Active Debug Code"
      owasp: "A05:2021 - Security Misconfiguration"
      category: security
      confidence: HIGH
      remediation: "Set debug=False in production environments."
    pattern-either:
      - pattern: $APP.run(..., debug=True, ...)
      - pattern: DEBUG = True

  - id: enterprise.security.insecure-tempfile
    languages: [python]
    severity: WARNING
    message: "Use of tempfile.mktemp() is vulnerable to symlink and race conditions."
    metadata:
      cwe: "CWE-377: Insecure Temporary File"
      owasp: "A01:2021 - Broken Access Control"
      category: security
      confidence: HIGH
      remediation: "Use tempfile.NamedTemporaryFile() or tempfile.TemporaryDirectory()."
    pattern: tempfile.mktemp(...)

  # ==========================================
  # JAVASCRIPT / TYPESCRIPT SECURITY RULES
  # ==========================================
  - id: enterprise.security.js-xss-innerhtml
    languages: [javascript, typescript]
    severity: ERROR
    message: "Direct assignment to innerHTML can lead to Cross-Site Scripting (XSS)."
    metadata:
      cwe: "CWE-79: Improper Neutralization of Input During Web Page Generation ('Cross-site Scripting')"
      owasp: "A03:2021 - Injection"
      category: security
      confidence: HIGH
      remediation: "Use textContent or a secure sanitization library like DOMPurify."
    pattern-either:
      - pattern: $ELEM.innerHTML = $DATA
      - pattern: $ELEM.outerHTML = $DATA

  - id: enterprise.security.js-dangerouslysetinnerhtml
    languages: [javascript, typescript]
    severity: ERROR
    message: "Use of dangerouslySetInnerHTML exposes the component to Cross-Site Scripting (XSS)."
    metadata:
      cwe: "CWE-79: Improper Neutralization of Input During Web Page Generation ('Cross-site Scripting')"
      owasp: "A03:2021 - Injection"
      category: security
      confidence: HIGH
      remediation: "Sanitize user HTML using DOMPurify before passing to dangerouslySetInnerHTML."
    pattern: "<$TAG ... dangerouslySetInnerHTML={{ __html: $HTML }} ... />"

  - id: enterprise.security.js-eval-code-execution
    languages: [javascript, typescript]
    severity: ERROR
    message: "Use of eval() or Function constructor allows arbitrary code execution."
    metadata:
      cwe: "CWE-94: Improper Control of Generation of Code ('Code Injection')"
      owasp: "A03:2021 - Injection"
      category: security
      confidence: HIGH
      remediation: "Avoid dynamic code execution. Parse structured data using JSON.parse()."
    pattern-either:
      - pattern: eval(...)
      - pattern: new Function(...)

  - id: enterprise.security.hardcoded-secret-js
    languages: [javascript, typescript]
    severity: ERROR
    message: "Identified hardcoded credential, secret key, or authentication token in JavaScript/TypeScript code."
    metadata:
      cwe: "CWE-798: Use of Hard-coded Credentials"
      owasp: "A07:2021 - Identification and Authentication Failures"
      category: security
      confidence: HIGH
      remediation: "Store credentials in environment variables or an enterprise secret manager."
    patterns:
      - pattern-either:
          - pattern: const $KEY = "$VAL"
          - pattern: let $KEY = "$VAL"
          - pattern: var $KEY = "$VAL"
      - metavariable-regex:
          metavariable: $VAL
          regex: (super-secret-token|AIzaSy|ghp_|AKIA|eyJhbG).*

  - id: enterprise.security.js-weak-crypto
    languages: [javascript, typescript]
    severity: WARNING
    message: "Use of insecure hash algorithm (MD5 or SHA-1) in Node.js crypto module."
    metadata:
      cwe: "CWE-328: Use of Weak Hash"
      owasp: "A02:2021 - Cryptographic Failures"
      category: security
      confidence: HIGH
      remediation: "Use SHA-256 or SHA-512 via crypto.createHash('sha256')."
    pattern-either:
      - pattern: crypto.createHash("md5")
      - pattern: crypto.createHash("sha1")

  - id: enterprise.security.js-command-injection
    languages: [javascript, typescript]
    severity: ERROR
    message: "Execution of shell commands with child_process.exec can lead to command injection."
    metadata:
      cwe: "CWE-78: Improper Neutralization of Special Elements used in an OS Command ('OS Command Injection')"
      owasp: "A03:2021 - Injection"
      category: security
      confidence: HIGH
      remediation: "Use child_process.execFile() or child_process.spawn() with argument lists instead of raw shell execution."
    pattern-either:
      - pattern: exec($CMD, ...)
      - pattern: child_process.exec($CMD, ...)

